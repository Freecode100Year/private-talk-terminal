name: Release

# Two ways to publish:
#   • push a tag vX.Y.Z, or
#   • bump the VERSION file on main — a release vX.Y.Z is created if it
#     doesn't exist yet.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  packages: write   # container image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Decide version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="$GITHUB_REF_NAME"
          else
            V="v$(tr -d ' \n' < VERSION)"
          fi
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version $V"; exit 1; }
          if gh release view "$V" >/dev/null 2>&1; then
            echo "release $V already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.v.outputs.skip != 'true'
        run: |
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          go test -count=1 ./...

      - name: Build
        if: steps.v.outputs.skip != 'true'
        run: |
          set -e
          V="${{ steps.v.outputs.version }}"
          FLAGS="-trimpath -ldflags=-s -ldflags=-w -ldflags=-X=main.version=${V}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64        go build $FLAGS -o dist/vivant-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64        go build $FLAGS -o dist/vivant-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7  go build $FLAGS -o dist/vivant-linux-armv7 .
          # same binaries under the pre-rename names, so "ptterm-ctl upgrade" on
          # servers that haven't migrated yet keeps working
          for a in amd64 arm64 armv7; do cp dist/vivant-linux-$a dist/ptterm-linux-$a; done
          # Windows / macOS: plain binaries for local testing and LANs (no installer)
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build $FLAGS -o dist/vivant-macos-amd64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build $FLAGS -o dist/vivant-macos-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build $FLAGS -o dist/vivant-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build $FLAGS -o dist/vivant-windows-arm64.exe .
          cp install.sh dist/
          deploy/make-offline-bundle.sh dist "$V"
          (cd dist && sha256sum vivant-* ptterm-linux-* install.sh > SHA256SUMS && cat SHA256SUMS)
          ./dist/vivant-linux-amd64 -version

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## 一键安装 · One-line install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Freecode100Year/vivant/main/install.sh | sudo bash
          ```

          已安装的服务器升级 · Upgrade an existing server: `sudo vivant-ctl upgrade`

          从 Private-Talk Terminal（ptterm）迁移：运行上面的一键命令即可，主机密钥、配置、封禁、洋葱地址都会保留。
          Migrating from Private-Talk Terminal (ptterm): run the command above; host key, config, bans and onion address are kept.

          离线安装（服务器连不上 GitHub）· Offline install (server can't reach GitHub): download `vivant-<version>-linux-offline.tar.gz`, copy it to the server, then `tar xzf … && cd … && sudo ./install.sh`.

          Windows / macOS：`vivant-windows-*.exe`、`vivant-macos-*` 只适合本机测试或局域网，没有安装器、沙箱和开机自启 · for local testing or a LAN only — no installer, sandbox or autostart.

          程序 Binaries: `vivant-linux-amd64` (x86_64), `vivant-linux-arm64` (ARM64, e.g. Oracle Ampere), `vivant-linux-armv7`；用 `SHA256SUMS` 校验 · verify with `SHA256SUMS`. (`ptterm-linux-*` are the same files under the old names.)
          EOF
          gh release create "$V" dist/* --target "$GITHUB_SHA" --title "$V" --notes-file notes.md --generate-notes

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.v.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        if: steps.v.outputs.skip != 'true'
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Container image
        if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Anonymous chat room over SSH
            org.opencontainers.image.licenses=MIT
