name: Release

# Two ways to publish:
#   • push a tag vX.Y.Z, or
#   • bump the VERSION file on main — a release vX.Y.Z is created if it
#     doesn't exist yet.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  packages: write   # container image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Decide version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="$GITHUB_REF_NAME"
          else
            V="v$(tr -d ' \n' < VERSION)"
          fi
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version $V"; exit 1; }
          if gh release view "$V" >/dev/null 2>&1; then
            echo "release $V already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.v.outputs.skip != 'true'
        run: |
          go mod verify
          go test -count=1 ./...

      - name: Build
        if: steps.v.outputs.skip != 'true'
        run: |
          set -e
          V="${{ steps.v.outputs.version }}"
          FLAGS="-trimpath -ldflags=-s -ldflags=-w -ldflags=-X=main.version=${V}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64        go build $FLAGS -o dist/ptterm-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64        go build $FLAGS -o dist/ptterm-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7  go build $FLAGS -o dist/ptterm-linux-armv7 .
          cp install.sh dist/
          (cd dist && sha256sum ptterm-linux-* install.sh > SHA256SUMS && cat SHA256SUMS)
          ./dist/ptterm-linux-amd64 -version

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## 一键安装 · One-line install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Freecode100Year/private-talk-terminal/main/install.sh | sudo bash
          ```

          已安装的服务器升级 · Upgrade an existing server: `sudo ptterm-ctl upgrade`

          Binaries: `ptterm-linux-amd64` (x86_64), `ptterm-linux-arm64` (ARM64 e.g. Oracle Ampere), `ptterm-linux-armv7`. Verify with `SHA256SUMS`.
          EOF
          gh release create "$V" dist/* --target "$GITHUB_SHA" --title "$V" --notes-file notes.md --generate-notes

      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.v.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        if: steps.v.outputs.skip != 'true'
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Container image
        if: steps.v.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ steps.v.outputs.version }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Anonymous chat room over SSH
            org.opencontainers.image.licenses=MIT
