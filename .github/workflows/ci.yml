name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify modules against the Go checksum database
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Cross-compile
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null .

      - name: Shellcheck installer
        run: shellcheck -S warning install.sh

      - name: Unit file in sync with installer
        run: bash install.sh --print-unit | diff -u deploy/ptterm.service -

  installer:
    # Real end-to-end run of install.sh on a systemd machine, using a local
    # "release" built from this commit.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        # keep a log of every step for the diagnostics step below
        shell: bash -eo pipefail {0}
    steps:
      - run: mkdir -p /tmp/ci-logs

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build local release
        run: |
          exec > >(tee -a /tmp/ci-logs/build-local-release.log) 2>&1
          set -x
          mkdir -p /tmp/rel
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" -o /tmp/rel/ptterm-linux-amd64 .
          (cd /tmp/rel && sha256sum ptterm-linux-* > SHA256SUMS)
          (cd /tmp/rel && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1

      - name: Install
        run: |
          exec > >(tee -a /tmp/ci-logs/install.log) 2>&1
          set -x
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/ptt_admin
          sudo PTT_DOWNLOAD_BASE=http://127.0.0.1:8765 bash install.sh --admin-key ~/.ssh/ptt_admin.pub --domain localhost

      - name: Chat over SSH
        run: |
          exec > >(tee -a /tmp/ci-logs/chat-over-ssh.log) 2>&1
          set -x
          out=$( (sleep 2; echo "/nick ci-bot"; sleep 0.5; echo "hello from CI"; sleep 0.5; echo "/quit") \
            | ssh -T -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no guest@127.0.0.1 )
          echo "$out"
          echo "$out" | grep -q "<ci-bot> hello from CI"

      - name: Exec is refused
        run: |
          exec > >(tee -a /tmp/ci-logs/exec-is-refused.log) 2>&1
          set -x
          out=$(ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no guest@127.0.0.1 id 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "only offers the chat room"

      - name: Client never sends a public key
        run: |
          exec > >(tee -a /tmp/ci-logs/no-key-offered.log) 2>&1
          set -x
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519   # a default key the client would normally offer
          log=$( (sleep 1; echo /quit) | ssh -v -T -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 2>&1 )
          echo "$log" | grep -E "Offering|Authenticated"
          echo "$log" | grep -q 'using "none"'
          if echo "$log" | grep -q "Offering public key"; then echo "client offered a key"; exit 1; fi

      - name: Tor onion service
        run: |
          exec > >(tee -a /tmp/ci-logs/tor.log) 2>&1
          set -x
          sudo PTT_DOWNLOAD_BASE=http://127.0.0.1:8765 ptterm-ctl install --tor
          onion=$(sudo cat /var/lib/tor/ptterm/hostname)
          echo "$onion" | grep -Eq '^[a-z2-7]{56}\.onion$'
          sudo ptterm-ctl status > /tmp/status.txt
          grep -q "Onion:" /tmp/status.txt
          # the local side of the onion service accepts chat sessions
          out=$( (sleep 1; echo /quit) | ssh -T -p 2224 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 )
          echo "$out" | grep -q "Welcome"
          ss -ltn > /tmp/ss.txt
          grep -q '127.0.0.1:2224 ' /tmp/ss.txt

      - name: Persistent bans
        run: |
          exec > >(tee -a /tmp/ci-logs/persist-bans.log) 2>&1
          set -x
          sudo PTT_DOWNLOAD_BASE=http://127.0.0.1:8765 ptterm-ctl install --persist-bans
          sudo journalctl -u ptterm -n 20 --no-pager > /tmp/j.txt
          grep -q "ban persistence enabled" /tmp/j.txt
          sudo test -f /var/lib/ptterm/ban.key
          test "$(sudo stat -c %a /var/lib/ptterm/ban.key)" = 600
          sudo PTT_DOWNLOAD_BASE=http://127.0.0.1:8765 ptterm-ctl install --no-persist-bans
          sudo test ! -e /var/lib/ptterm/ban.key

      - name: Status, reinstall, uninstall
        run: |
          exec > >(tee -a /tmp/ci-logs/status-reinstall-uninstall.log) 2>&1
          set -x
          sudo ptterm-ctl status
          sudo PTT_DOWNLOAD_BASE=http://127.0.0.1:8765 ptterm-ctl install --port 2299
          ss -ltn > /tmp/ss.txt
          grep -q ':2299 ' /tmp/ss.txt
          sudo ptterm-ctl uninstall --purge
          if grep -q "private-talk-terminal" /etc/tor/torrc; then echo "torrc not cleaned"; exit 1; fi
          test ! -e /var/lib/tor/ptterm
          if systemctl is-active --quiet ptterm; then echo "still running"; exit 1; fi
          test ! -e /usr/local/bin/ptterm

      - name: Diagnostics
        if: failure()
        run: |
          # Surface logs as annotations (readable via the checks API).
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g'; }
          for f in /tmp/ci-logs/*.log; do
            echo "::error title=$(basename "$f")::$(tail -n 40 "$f" | enc)"
          done
          echo "::error title=journal::$(sudo journalctl -u ptterm -n 40 --no-pager 2>&1 | enc)"
          echo "::error title=systemctl::$(systemctl status ptterm --no-pager 2>&1 | tail -n 20 | enc)"
